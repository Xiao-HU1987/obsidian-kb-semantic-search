name: Release

# 打 tag 即发布：构建 → 校验可复现性 → 生成构建溯源证明 → 创建 Release 并上传资产。
# 请勿再手工 gh release create，否则资产不带 attestation（目录扫描会提示 RELEASES 段 Recommendation）。
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ($tag) 与 manifest.json 的 version ($ver) 不一致"
            exit 1
          fi

      - name: Verify build is byte-for-byte reproducible
        run: |
          if ! git diff --exit-code -- main.js; then
            echo "::error::构建产物与仓库提交的 main.js 不一致：请本地执行 npm run build 后提交产物再打 tag"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
